<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5f73">
  <title>Giriş · Evrak Kontrol</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: var(--shadow);
    }

    .login h1 {
      font-size: 1.4rem;
      letter-spacing: -.01em;
    }

    .login .sub {
      color: var(--muted);
      margin: 4px 0 22px;
    }

    .login form {
      display: grid;
      gap: 14px;
    }

    .pw {
      position: relative;
    }

    .pw input {
      padding-right: 84px;
    }

    .pw .link {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      min-height: 40px;
      padding: 0 10px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .95rem;
      min-height: 32px;
    }

    .remember input {
      width: 20px;
      height: 20px;
      min-height: 0;
      accent-color: var(--brand);
    }

    .err {
      color: var(--danger);
      font-size: .92rem;
      min-height: 1.3em;
      margin: 0;
    }

    .login .btn {
      width: 100%;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <main class="login">
    <h1>Evrak Kontrol</h1>
    <p class="sub">Devam etmek için giriş yapın.</p>

    <form id="loginForm" autocomplete="on">
      <label class="field">
        <span>Kullanıcı adı</span>
        <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required
          autofocus>
      </label>

      <label class="field">
        <span>Şifre</span>
        <div class="pw">
          <input id="pass" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="toggle" class="link" aria-pressed="false">Göster</button>
        </div>
      </label>

      <p id="err" class="err" role="alert" aria-live="assertive"></p>
      <button id="submit" class="btn primary" type="submit">Giriş yap</button>
    </form>
  </main>

  <script>
    const SUPABASE_URL = 'https://rcvyytkxcgmydkcicxdz.supabase.co';
    const SUPABASE_KEY = 'YOUR_SECRET_KEY_HERE'; // .env dosyasından alınacak
    const TABLE_NAME = 'Kullanıcılar';

    const SESSION_KEY = 'evrak-oturum';
    const LOGIN_FLOW_KEY = 'evrak-login-flow';
    const HOURS = 12;
    const MAX_TRIES = 5, LOCK_SEC = 30;

    const $ = s => document.querySelector(s);
    const form = $('#loginForm'), err = $('#err'), btn = $('#submit');

    (function () {
      try {
        sessionStorage.removeItem(LOGIN_FLOW_KEY);
      } catch (e) { }
    })();

    $('#toggle').addEventListener('click', e => {
      const p = $('#pass'), show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      e.target.textContent = show ? 'Gizle' : 'Göster';
      e.target.setAttribute('aria-pressed', show);
    });

    $('#user').addEventListener('input', e => {
      e.target.value = e.target.value.toLocaleLowerCase('tr-TR');
    });

    let tries = 0, lockTimer;
    function lock() {
      let left = LOCK_SEC;
      btn.disabled = true;
      clearInterval(lockTimer);
      lockTimer = setInterval(() => {
        err.textContent = `Çok fazla hatalı deneme. ${left} sn sonra tekrar deneyin.`;
        if (left-- <= 0) { clearInterval(lockTimer); btn.disabled = false; tries = 0; err.textContent = ''; }
      }, 1000);
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      err.textContent = '';

      const ad = $('#user').value.trim();
      const pass = $('#pass').value;

      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?name=eq.${encodeURIComponent(ad)}&pass=eq.${encodeURIComponent(pass)}&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!res.ok) throw new Error('Veritabanı bağlantısında sorun oluştu.');

        const data = await res.json();

        if (data.length > 0) {
          const session = JSON.stringify({ user: ad, exp: Date.now() + HOURS * 3600 * 1000 });
          localStorage.removeItem(SESSION_KEY);
          sessionStorage.removeItem(SESSION_KEY);
          localStorage.setItem(SESSION_KEY, session);
          sessionStorage.setItem('evrak-allow-index', '1');
          location.replace('index.html');
        } else {
          $('#pass').value = '';
          $('#pass').focus();
          if (++tries >= MAX_TRIES) return lock();
          err.textContent = 'Kullanıcı adı veya şifre hatalı.';
        }
      } catch (error) {
        err.textContent = error.message;
      } finally {
        if (tries < MAX_TRIES) btn.disabled = false;
        btn.textContent = 'Giriş yap';
      }
    });
  </script>
</body>

</html>

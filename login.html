<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5f73">
<title>Giriş · Evrak Kontrol</title>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .login { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px; box-shadow: var(--shadow); }
  .login h1 { font-size: 1.4rem; letter-spacing: -.01em; }
  .login .sub { color: var(--muted); margin: 4px 0 22px; }
  .login form { display: grid; gap: 14px; }
  .pw { position: relative; }
  .pw input { padding-right: 84px; }
  .pw .link { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); min-height: 40px; padding: 0 10px; }
  .remember { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .95rem; min-height: 32px; }
  .remember input { width: 20px; height: 20px; min-height: 0; accent-color: var(--brand); }
  .err { color: var(--danger); font-size: .92rem; min-height: 1.3em; margin: 0; }
  .login .btn { width: 100%; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
</style>
</head>
<body>

<main class="login">
  <h1>Evrak Kontrol</h1>
  <p class="sub">Devam etmek için giriş yapın.</p>

  <form id="loginForm" autocomplete="on">
    <label class="field">
      <span>Kullanıcı adı</span>
      <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>

    <label class="field">
      <span>Şifre</span>
      <div class="pw">
        <input id="pass" name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="toggle" class="link" aria-pressed="false">Göster</button>
      </div>
    </label>

    <label class="remember"><input id="remember" type="checkbox"> Bu cihazda oturumu açık tut (12 saat)</label>

    <p id="err" class="err" role="alert" aria-live="assertive"></p>
    <button id="submit" class="btn primary" type="submit">Giriş yap</button>
  </form>
</main>

<script>
/* ---------------------------------------------------------------
   KULLANICILAR
   Şifreler düz metin değil, SHA-256 özeti olarak tutulur.
   Varsayılan:  kullanıcı "admin"  /  şifre "admin123"  (mutlaka değiştirin)

   Yeni özet üretmek için tarayıcı konsoluna şunu yapıştırın (şifreyi değiştirin):
   crypto.subtle.digest('SHA-256', new TextEncoder().encode('YENI_SIFRE'))
     .then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('')))
---------------------------------------------------------------- */
const USERS = [
  { ad: 'admin', hash: '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9' }
];
const SESSION_KEY = 'evrak-oturum';
const HOURS = 12;
const MAX_TRIES = 5, LOCK_SEC = 30;

const $ = s => document.querySelector(s);
const form = $('#loginForm'), err = $('#err'), btn = $('#submit');

/* Zaten girişliyse doğrudan uygulamaya git */
(function () {
  for (const st of [localStorage, sessionStorage]) {
    try {
      const s = JSON.parse(st.getItem(SESSION_KEY) || 'null');
      if (s && Date.now() < s.exp) return location.replace('index.html');
    } catch (e) {}
  }
})();

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

$('#toggle').addEventListener('click', e => {
  const p = $('#pass'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  e.target.textContent = show ? 'Gizle' : 'Göster';
  e.target.setAttribute('aria-pressed', show);
});

let tries = 0, lockTimer;
function lock() {
  let left = LOCK_SEC;
  btn.disabled = true;
  clearInterval(lockTimer);
  lockTimer = setInterval(() => {
    err.textContent = `Çok fazla hatalı deneme. ${left} sn sonra tekrar deneyin.`;
    if (left-- <= 0) { clearInterval(lockTimer); btn.disabled = false; tries = 0; err.textContent = ''; }
  }, 1000);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = '';
  if (!window.crypto?.subtle) {
    err.textContent = 'Giriş için güvenli bağlantı (https) gerekli.';
    return;
  }
  const ad = $('#user').value.trim().toLowerCase();
  const hash = await sha256($('#pass').value);
  const ok = USERS.some(u => u.ad.toLowerCase() === ad && u.hash === hash);

  if (!ok) {
    $('#pass').value = '';
    $('#pass').focus();
    if (++tries >= MAX_TRIES) return lock();
    err.textContent = 'Kullanıcı adı veya şifre hatalı.';
    return;
  }
  const session = JSON.stringify({ user: ad, exp: Date.now() + HOURS * 3600 * 1000 });
  localStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  ($('#remember').checked ? localStorage : sessionStorage).setItem(SESSION_KEY, session);
  location.replace('index.html');
});
</script>
</body>
</html>

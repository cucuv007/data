<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5f73">
  <title>Giriş · Evrak Kontrol</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: var(--shadow);
    }

    .login h1 {
      font-size: 1.4rem;
      letter-spacing: -.01em;
    }

    .login .sub {
      color: var(--muted);
      margin: 4px 0 22px;
    }

    .login form {
      display: grid;
      gap: 14px;
    }

    .pw {
      position: relative;
    }

    .pw input {
      padding-right: 84px;
    }

    .pw .link {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      min-height: 40px;
      padding: 0 10px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .95rem;
      min-height: 32px;
    }

    .remember input {
      width: 20px;
      height: 20px;
      min-height: 0;
      accent-color: var(--brand);
    }

    .err {
      color: var(--danger);
      font-size: .92rem;
      min-height: 1.3em;
      margin: 0;
    }

    .login .btn {
      width: 100%;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <main class="login">
    <h1>Evrak Kontrol</h1>
    <p class="sub">Devam etmek için giriş yapın.</p>

    <form id="loginForm" autocomplete="on">
      <label class="field">
        <span>Kullanıcı adı</span>
        <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required
          autofocus>
      </label>

      <label class="field">
        <span>Şifre</span>
        <div class="pw">
          <input id="pass" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="toggle" class="link" aria-pressed="false">Göster</button>
        </div>
      </label>

      <p id="err" class="err" role="alert" aria-live="assertive"></p>
      <button id="submit" class="btn primary" type="submit">Giriş yap</button>
    </form>
  </main>

  <script src="login.js"></script>
</body>

</html>
